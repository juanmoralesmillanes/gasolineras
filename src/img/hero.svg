  </g>
  <g>
    <rect x="330" y="186" width="72" height="112" rx="12" fill="#ffb020"/>
    <rect x="342" y="200" width="48" height="32" rx="5" fill="#fff8e6"/>
    <text x="366" y="222" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#10261b">D</text>
