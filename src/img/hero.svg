    <linearGradient id="can" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a2b"/><stop offset="1" stop-color="#10261b"/></linearGradient>
  </defs>
  <rect width="640" height="400" rx="28" fill="url(#sky)"/>
  <circle cx="548" cy="64" r="30" fill="#ffb020" opacity=".9"/>
