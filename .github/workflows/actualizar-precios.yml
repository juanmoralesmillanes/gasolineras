name: Actualizar precios
on:
  schedule:
    - cron: '23 5 * * *'    # 06:23 / 07:23 hora de Madrid
    - cron: '23 13 * * *'   # 14:23 / 15:23 hora de Madrid
  workflow_dispatch:
permissions:
  contents: write
concurrency: precios
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar precios oficiales del Ministerio
        run: node scripts/descargar-precios.mjs
      - name: Guardar (Cloudflare Pages publica la web al recibir el commit)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/estaciones.json data/historico.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Precios del $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')" && git push; fi
