name: Rellenar histórico
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás (máx. 400)'
        default: '120'
permissions:
  contents: write
concurrency: precios
jobs:
  rellenar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar el histórico oficial día a día
        run: node scripts/historico-atras.mjs "${{ github.event.inputs.dias }}"
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/historico.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Histórico de precios rellenado" && git pull --rebase && git push; fi
